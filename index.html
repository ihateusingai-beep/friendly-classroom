<head><script>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){

    catch (_) { works = false; }

    catch (_) { try { window[name] = makeStore(); } catch (__) {} }

  tryShim('sessionStorage');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>友愛教室 - 像素大冒險</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+HK:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #2d1b0e;
      --bg-mid: #4a3728;
      --bg-light: #6b4f3a;
      --cream: #f5d89a;
      --cream-dark: #d4a855;
      --orange: #e87830;
      --orange-dark: #b85a20;
      --yellow: #ffd93f;
      --red: #e83838;
      --green: #4caf50;
      --blue: #64B5F6;
      --white: #fff8e0;
      --shadow: #1a0f07;
      --purple: #9c27b0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'Pixel';
      src: local('Press Start 2P'), local('Courier New');
    }

    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: 'Noto Sans HK', 'PingFang HK', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      padding: 20px;
      background-image: 
        linear-gradient(45deg, #3d2514 25%, transparent 25%),
        linear-gradient(-45deg, #3d2514 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #3d2514 75%),
        linear-gradient(-45deg, transparent 75%, #3d2514 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* 像素風標題 */
    .header {
      text-align: center;
      margin-bottom: 30px;
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 20px;
      box-shadow: 
        8px 8px 0 var(--shadow),
        -4px -4px 0 var(--cream-dark);
    }

    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--orange-dark);
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .header p {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
    }

    /* 像素心仔 */
    .pixel-heart {
      display: inline-block;
      width: 20px;
      height: 20px;
      background: var(--red);
      position: relative;
      transform: rotate(45deg);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .pixel-heart::before,
    .pixel-heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--red);
      border-radius: 50%;
    }

    .pixel-heart::before {
      left: -10px;
    }

    .pixel-heart::after {
      top: -10px;
    }

    /* 關係值卡 */
    .relationships {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .char-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 15px 20px;
      text-align: center;
      box-shadow: 6px 6px 0 var(--shadow);
    }

    .char-emoji {
      font-size: 40px;
      margin-bottom: 8px;
      image-rendering: pixelated;
    }

    .char-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
      margin-bottom: 10px;
    }

    .char-bar-container {
      width: 100%;
      height: 16px;
      background: var(--bg-dark);
      border: 2px solid var(--cream);
      position: relative;
    }

    .char-bar-fill {
      height: 100%;
      background: var(--green);
      transition: width 0.3s steps(10);
    }

    .char-bar-fill.low { background: var(--red); }
    .char-bar-fill.medium { background: var(--orange); }
    .char-bar-fill.high { background: var(--green); }

    .char-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--white);
      margin-top: 5px;
    }
    .moral-card {
      border-color: var(--yellow) !important;
      background: linear-gradient(135deg, var(--bg-mid), #3a2f00) !important;
    }

    /* 情景卡 */
    .scenario-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 30px;
      box-shadow: 8px 8px 0 var(--shadow);
    }

    .scenario-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 20px;
      text-align: center;
    }

    .scenario-desc {
      font-size: 20px;
      color: var(--white);
      line-height: 1.8;
      margin-bottom: 30px;
      text-align: center;
      background: var(--bg-dark);
      padding: 20px;
      border: 2px solid var(--bg-light);
    }

    /* 像素選項按鈕 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option-btn {
      background: var(--bg-dark);
      border: 4px solid var(--cream);
      padding: 20px 25px;
      font-family: 'Noto Sans HK', sans-serif;
      font-size: 18px;
      color: var(--white);
      cursor: pointer;
      transition: all 0.1s steps(5);
      text-align: left;
      position: relative;
    }

    .option-btn::before {
      content: '►';
      position: absolute;
      left: 10px;
      color: var(--yellow);
    }

    .option-btn:hover {
      background: var(--bg-light);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--shadow);
      cursor: pointer;
    }

    .option-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .option-letter {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--yellow);
      margin-right: 10px;
    }

    .moral-warn {
      font-size: 11px;
      font-family: 'Press Start 2P', monospace;
      padding: 3px 6px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .warn-positive { color: var(--green); border: 2px solid var(--green); }
    .warn-negative { color: var(--red); border: 2px solid var(--red); }
    .warn-neutral { color: #aaa; border: 2px solid #aaa; }

    /* 兩選項簡化模式徽章 */
    .simple-mode-badge {
      text-align: center;
      margin-top: 12px;
      padding: 6px 14px;
      background: var(--bg-light);
      border: 3px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      animation: pulse-badge 2s infinite;
    }
    @keyframes pulse-badge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 結果彈窗 */
    .result-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .result-overlay.show {
      display: flex;
    }

    .result-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 40px;
      max-width: 600px;
      text-align: center;
      box-shadow: 8px 8px 0 var(--shadow);
    }

    /* FeedbackModal 樣式 */
    .feedback-modal {
      max-width: 550px;
    }

    .feedback-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 20px;
    }
    .feedback-title.title-positive { color: var(--green); text-shadow: 2px 2px 0 #166534; }
    .feedback-title.title-negative { color: var(--red); text-shadow: 2px 2px 0 #991b1b; }

    .change-amount {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
    }
    .change-amount.positive { color: var(--green); }
    .change-amount.negative { color: var(--red); }

    .guidance-tip {
      font-size: 20px;
      color: var(--white);
      line-height: 1.8;
      margin: 25px 0;
      padding: 20px;
      background: var(--bg-dark);
      border: 2px dashed var(--yellow);
    }

    .retry-btn {
      background: transparent;
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 12px 25px;
      font-family: 'Noto Sans HK', sans-serif;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .retry-btn:hover {
      background: var(--bg-light);
    }

    /* QuestionCard 元件 */
    .question-tools {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      color: var(--cream);
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: var(--bg-light);
      border-color: var(--yellow);
    }

    .tool-btn.speaking {
      background: var(--orange);
      border-color: var(--yellow);
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 3-Tier ARPG Hint System ========== */
    .hint-container {
      margin-top: 15px;
      position: relative;
    }

    .hint-tiers {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      justify-content: flex-end;
    }

    .hint-tier-btn {
      padding: 4px 10px;
      border-radius: 12px;
      border: 2px solid;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .hint-tier-btn.tier-1 {
      background: rgba(100, 181, 246, 0.15);
      border-color: var(--blue);
      color: var(--blue);
    }

    .hint-tier-btn.tier-2 {
      background: rgba(255, 213, 79, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .hint-tier-btn.tier-3 {
      background: rgba(156, 39, 176, 0.15);
      border-color: var(--purple);
      color: var(--purple);
    }

    .hint-tier-btn.active {
      transform: scale(1.1);
      box-shadow: 0 0 12px currentColor;
    }

    .hint-tier-btn.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ========== ARPG Keyword Highlight ========== */
    .keyword-highlight {
      color: var(--yellow);
      font-weight: 700;
      text-shadow: 0 0 8px var(--yellow), 0 0 16px var(--orange);
      cursor: pointer;
      border-bottom: 2px dashed var(--yellow);
      transition: all 0.2s;
    }
    .keyword-highlight:hover {
      color: var(--white);
      background: rgba(255, 217, 63, 0.2);
      text-shadow: 0 0 12px var(--white), 0 0 20px var(--yellow);
    }
    .keyword-highlight::after {
      content: '💬';
      font-size: 0.7em;
      margin-left: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .keyword-highlight:hover::after { opacity: 1; }

    .hint-box {
      background: rgba(255, 217, 63, 0.1);
      border: 2px dashed var(--yellow);
      padding: 15px;
      margin-top: 0;
      font-size: 18px;
      color: var(--yellow);
      display: none;
    }

    .hint-box.tier-1 {
      background: rgba(100, 181, 246, 0.08);
      border-color: var(--blue);
      border-style: dotted;
      color: var(--blue);
    }

    .hint-box.tier-2 {
      background: rgba(255, 213, 79, 0.1);
      border-style: dashed;
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .hint-box.tier-3 {
      background: rgba(156, 39, 176, 0.12);
      border-style: solid;
      border-color: var(--purple);
      color: var(--purple);
    }

    .hint-box.show {
      display: block;
      animation: hintPopIn 0.3s ease;
    }

    @keyframes hintPopIn {
      0% { opacity: 0; transform: scale(0.9) translateY(-5px); }
      50% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .hint-text-tier {
      display: none;
    }

    .hint-text-tier.current {
      display: block;
    }

    .hint-cost {
      font-size: 13px;
      margin-left: 8px;
      opacity: 0.8;
    }

    /* SceneCard 元件 */
    .scene-card {
      margin-bottom: 30px;
    }

    /* 角色展示區 */
    .character-stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      min-height: 120px;
      margin-bottom: 25px;
      padding: 20px;
      background: var(--bg-dark);
      border: 3px solid var(--bg-light);
      border-radius: 15px;
      position: relative;
    }

    .character-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s;
    }

    .character-avatar.speaking {
      transform: scale(1.1);
    }

    .character-avatar Emoji {
      font-size: 64px;
      filter: drop-shadow(3px 3px 0 var(--shadow));
    }

    .character-avatar.speaking Emoji {
      animation: bounce 0.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .character-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
      margin-top: 8px;
      background: var(--bg-mid);
      padding: 5px 10px;
      border-radius: 5px;
    }

    /* 對話氣泡 */
    .dialogue-bubble {
      background: white;
      color: var(--bg-dark);
      padding: 15px 20px;
      border-radius: 20px;
      position: relative;
      max-width: 80%;
      font-size: 18px;
      line-height: 1.5;
      margin: 10px auto;
    }

    .dialogue-bubble::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-bottom-color: white;
    }

    .dialogue-bubble.from-player {
      background: var(--cream);
      align-self: flex-end;
    }

    .dialogue-bubble.from-npc {
      background: var(--white);
      align-self: flex-start;
    }

    /* 場景背景描述 */
    .scene-background {
      font-size: 14px;
      color: var(--bg-light);
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Press Start 2P', monospace;
    }

    /* 開始畫面 */
    .start-screen {
      text-align: center;
      padding: 40px;
    }

    .start-screen h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--yellow);
      margin-bottom: 20px;
    }

    .start-screen p {
      font-size: 18px;
      color: var(--cream);
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .start-btn {
      background: var(--green);
      border: 4px solid var(--yellow);
      padding: 20px 60px;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: var(--white);
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 6px 6px 0 var(--shadow);
      transition: all 0.2s;
    }

    .start-btn:hover {
      background: var(--orange);
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    /* 場景選擇 */
    .location-selection { margin: 20px 0; }
    .location-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .location-btn { background: var(--bg-mid); border: 3px solid var(--cream-dark); color: var(--cream); padding: 12px 20px; font-family: 'Noto Sans HK', sans-serif; font-size: 14px; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .option-btn:hover::before { color: var(--green); }

    /* Option wrapper + speak button */
    .option-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .option-speak-btn {
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      color: var(--cream);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-speak-btn:hover {
      background: var(--orange);
      border-color: var(--yellow);
      transform: scale(1.1);
    }
    .option-speak-btn.speaking {
      animation: pulse 0.5s infinite;
      background: var(--green);
    }
    /* SettingsPanel 側邊欄 */
    .settings-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-mid);
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      z-index: 50;
      transition: all 0.2s;
    }

    .settings-toggle:hover {
      background: var(--bg-light);
    }

    .settings-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
      background: var(--bg-mid);
      border-left: 4px solid var(--cream);
      padding: 30px 20px;
      z-index: 100;
      transition: right 0.3s ease;
      overflow-y: auto;
      box-shadow: -8px 0 30px rgba(0,0,0,0.5);
    }

    .settings-panel.open {
      right: 0;
    }

    .settings-panel h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 25px;
      text-align: center;
    }

    .settings-section {
      margin-bottom: 25px;
    }

    .settings-label {
      font-size: 14px;
      color: var(--cream);
      margin-bottom: 10px;
      display: block;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* 字體滑桿 */
    .font-slider {
      width: 100%;
      height: 10px;
      -webkit-appearance: none;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 5px;
      outline: none;
    }

    .font-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--orange);
      border: 2px solid var(--yellow);
      border-radius: 50%;
      cursor: pointer;
    }

    .font-size-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--orange);
      text-align: center;
      margin-top: 5px;
    }

    /* 語速滑桿 */
    .speed-slider {
      width: 100%;
      height: 10px;
      -webkit-appearance: none;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 5px;
      outline: none;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--green);
      border: 2px solid var(--yellow);
      border-radius: 50%;
      cursor: pointer;
    }

    .speed-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--green);
      text-align: center;
      margin-top: 5px;
    }

    /* 開關 toggle */
    .toggle-switch {
      position: relative;
      width: 60px;
      height: 30px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 30px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      position: absolute;
      content: '';
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background: var(--cream);
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--green);
      border-color: var(--green);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(30px);
    }

    .settings-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: var(--cream);

    .particle { position: absolute; font-size: 20px; animation: particle-fly 1s ease-out forwards; }
    @keyframes particle-fly { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0.5); } }

    .shake { animation: screen-shake 0.3s ease-out; }
    @keyframes screen-shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-5px,5px); } 40% { transform: translate(5px,-5px); } 60% { transform: translate(-3px,3px); } 80% { transform: translate(3px,-3px); } }

    /* Accessibility: reduce motion support */
    @media (prefers-reduced-motion: reduce) {

    .reduced-motion .particle,

    .reduced-motion .positive-flash,

<body>

<!-- 遊戲區 -->

  <!-- Admin Panel -->

    <button onclick="saveScenarios()" aria-label="儲存設定">💾 儲存</button>

  <script>
    let gameData = { scenarios: [], endings: [] };
    let relationships = {};
    let moral = 50; // 道德值 0-100
    let currentScenario = null;
    let currentScenarioNum = 0;
    let totalScenarios = 0; // 動態計算
    let completedScenarios = [];

    // 道德徽章系統
    let badges = []; // 已獲得的徽章ID列表
    const BADGE_DEFS = [
      { id: 'honest', emoji: '💚', name: '誠實章', desc: '選擇坦誠嘅行為', condition: (st) => st.honestChoices >= 2 },
      { id: 'brave', emoji: '⚡', name: '道德勇氣章', desc: '為正道挺身而出', condition: (st) => st.braveChoices >= 1 },
      { id: 'kind', emoji: '🌟', name: '善良章', desc: '主動關心帮助他人', condition: (st) => st.kindChoices >= 3 },
      { id: 'fair', emoji: '⚖️', name: '公平章', desc: '堅守原則不偏私', condition: (st) => st.fairChoices >= 2 },
      { id: 'growth', emoji: '🚀', name: '成長章', desc: '勇於承認過錯並改正', condition: (st) => st.growthChoices >= 1 },
      { id: 'champion', emoji: '🏆', name: '友誼大使章', desc: '道德值達到90或以上', condition: (st) => st.moral >= 90 },
      { id: 'friendmaker', emoji: '❤️', name: '社交高手章', desc: '平均關係值達到80或以上', condition: (st) => st.avgRel >= 80 }
    ];
    // 追蹤統計
    let choiceStats = { honestChoices: 0, braveChoices: 0, kindChoices: 0, fairChoices: 0, growthChoices: 0 };

    // 課堂排行榜
    let leaderboard = []; // {id, name, moral, avgRel, badges, date}
    const MAX_LEADERBOARD = 20;
    
    // Settings
    let settings = {
      fontSize: 20,
      speechRate: 0.9,
      soundEnabled: true,
      playerName: '',
      autoVoiceRead: true,  // 語音強化模式：自動朗讀所有文字
      simpleMode: false     // 兩選項簡化模式
    };

    // Get player name (from input or saved)
    function getPlayerName() {
      const input = document.getElementById('player-name');
      if (input && input.value.trim()) {
        settings.playerName = input.value.trim();
        saveSettings();
        return settings.playerName;
      }
      return settings.playerName || '同學';
    }

    // Audio System (Web Audio API - no external files needed)
    const AudioSys = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, duration, type = 'sine', volume = 0.3) {
        if (!settings.soundEnabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      // UI click
      click() { this.playTone(800, 0.1, 'square', 0.1); },
      // Positive choice
      success() { 
        this.playTone(523, 0.2, 'sine', 0.2);
        setTimeout(() => this.playTone(659, 0.2, 'sine', 0.2), 100);
      },
      // Negative choice  
      fail() { 
        this.playTone(200, 0.3, 'sawtooth', 0.15); 
      },
      // Badge獲得
      badge() {
        this.playTone(784, 0.15, 'sine', 0.2);
        setTimeout(() => this.playTone(988, 0.15, 'sine', 0.2), 80);
        setTimeout(() => this.playTone(1319, 0.3, 'sine', 0.25), 160);
      },
      // Game complete
      complete() {
        [523, 659, 784, 1047].forEach((f, i) => 
          setTimeout(() => this.playTone(f, 0.2, 'sine', 0.2), i * 150)
        );
      }
    };

    // Sound Engine (enhanced audio with sound pool)
    const SoundEngine = {
      ctx: null,
      poolSize: 4,
      pool: [],
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < this.poolSize; i++) {
          this.pool.push({ osc: null, gain: null, busy: false });
        }
      },
      getAvailable() {
        this.init();
        for (let i = 0; i < this.pool.length; i++) {
          if (!this.pool[i].busy) return this.pool[i];
        }
        return null;
      },
      play(freq, duration, type = 'sine', volume = 0.3) {
        if (!settings.soundEnabled) return;
        const slot = this.getAvailable();
        if (!slot) return;
        slot.busy = true;
        slot.osc = this.ctx.createOscillator();
        slot.gain = this.ctx.createGain();
        slot.osc.type = type;
        slot.osc.frequency.value = freq;
        slot.gain.gain.value = volume;
        slot.gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        slot.osc.connect(slot.gain);
        slot.gain.connect(this.ctx.destination);
        slot.osc.start();
        slot.osc.stop(this.ctx.currentTime + duration);
        setTimeout(() => { slot.busy = false; }, duration * 1000);
      },
      click() { this.play(800, 0.1, 'square', 0.1); },
      success() { 
        this.play(523, 0.2, 'sine', 0.2);
        setTimeout(() => this.play(659, 0.2, 'sine', 0.2), 100);
      },
      fail() { this.play(200, 0.3, 'sawtooth', 0.15); },
      badge() {
        this.play(784, 0.15, 'sine', 0.2);
        setTimeout(() => this.play(988, 0.15, 'sine', 0.2), 80);
        setTimeout(() => this.play(1319, 0.3, 'sine', 0.25), 160);
      },
      complete() {
        [523, 659, 784, 1047].forEach((f, i) => 
          setTimeout(() => this.play(f, 0.2, 'sine', 0.2), i * 150)
        );
      }
    };

    // Game Stats (gamification)
    let gameStats = {
      gamesPlayed: 0,
      totalScore: 0,
      bestScore: 0,
      currentStreak: 0,
      bestStreak: 0,
      perfectGames: 0, // all positive choices
      badges: [], // earned badges
      skills: { empathy: 0, respect: 0, courage: 0, honesty: 0, kindness: 0, communication: 0 }, // 6核心友誼技能
      unlockedConcepts: [], // 解鎖既概念卡
      streakCorrect: 0, // 連續答對關卡數
      scenariosCompleted: 0, // 已完成關卡數
      totalScenarios: 15, // 總關卡數（會動態更新）
      moralBest: 0 // 最高道德積分
    };

    // 每週進度追蹤
    const WEEKLY_KEY = 'fc-weekly-progress';
    function getWeeklyProgress() {
      const data = localStorage.getItem(WEEKLY_KEY);
      if (!data) return { week: getWeekNumber(), completed: 0, moralEarned: 0, totalMoral: 0 };
      const parsed = JSON.parse(data);
      const currentWeek = getWeekNumber();
      if (parsed.week !== currentWeek) return { week: currentWeek, completed: 0, moralEarned: 0, totalMoral: 0 };
      return parsed;
    }
    function saveWeeklyProgress(progress) {
      localStorage.setItem(WEEKLY_KEY, JSON.stringify(progress));
    }
    function getWeekNumber() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      return Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
    }

    // 套用設定
    function applySettings() {
      const fontSlider = document.getElementById('fontSizeSlider');
      if (fontSlider) fontSlider.value = settings.fontSize;
      const fontDisplay = document.getElementById('fontDisplay');
      if (fontDisplay) fontDisplay.innerText = settings.fontSize + 'px';
      const speedSlider = document.getElementById('speedSlider');
      if (speedSlider) speedSlider.value = settings.speechRate;
      const speedDisplay = document.getElementById('speedDisplay');
      if (speedDisplay) speedDisplay.innerText = settings.speechRate + 'x';
      
      // Sound toggle
      const soundToggle = document.getElementById('soundToggle');
      if (soundToggle) soundToggle.checked = settings.soundEnabled;
      const soundStatus = document.getElementById('soundStatus');
      if (soundStatus) soundStatus.innerText = settings.soundEnabled ? '開' : '關';

      // Auto Voice toggle
      const autoVoiceToggle = document.getElementById('autoVoiceToggle');
      if (autoVoiceToggle) autoVoiceToggle.checked = settings.autoVoiceRead;
      const autoVoiceStatus = document.getElementById('autoVoiceStatus');
      if (autoVoiceStatus) autoVoiceStatus.innerText = settings.autoVoiceRead ? '開' : '關';

      // Simple Mode toggle
      const simpleModeToggle = document.getElementById('simpleModeToggle');
      if (simpleModeToggle) simpleModeToggle.checked = settings.simpleMode;
      const simpleModeStatus = document.getElementById('simpleModeStatus');
      if (simpleModeStatus) simpleModeStatus.innerText = settings.simpleMode ? '開' : '關';

      // Font sizes
      const elements = document.querySelectorAll('.scenario-desc, .dialogue-bubble, .option-btn, .hint-box, .result-comment');
      elements.forEach(el => {
        el.style.fontSize = settings.fontSize + 'px';
      });
    }

    // 讀取情景數據
    function loadScenarios() {
      // 直接使用內置數據，唔再 fetch
      gameData = getDefaultScenarios();
      totalScenarios = gameData.scenarios.length; // 動態計算總關卡數
      gameStats.totalScenarios = totalScenarios; // 同步到 gameStats
      buildCharacterCache();
    }
    
    // Build character emoji cache for O(1) lookup
    function buildCharacterCache() {
      characterEmojiCache = {};
      for (const scenario of gameData.scenarios) {
        if (scenario.characters) {
          for (const char of scenario.characters) {
            characterEmojiCache[char.name] = char.emoji;
          }
        }
      }
    }

    // 讀取關係值
    function loadRelationships() {
      const saved = localStorage.getItem('friendly-classroom-v2');
      if (saved) {
        const data = JSON.parse(saved);
        relationships = data.relationships || {};
        moral = data.moral !== undefined ? data.moral : 50;
      }
    }

    // 儲存關係值
    function saveRelationships() {
      localStorage.setItem('friendly-classroom-v2', JSON.stringify({ relationships, moral }));
    }

    // Load/Save Game Stats
    function loadGameStats() {
      const saved = localStorage.getItem('friendly-classroom-stats');
      if (saved) {
        const parsed = JSON.parse(saved);
        // 兼容舊既存檔 + 新既欄位
        gameStats = { ...gameStats, ...parsed };
        if (!gameStats.skills) gameStats.skills = { empathy: 0, respect: 0, courage: 0, honesty: 0, kindness: 0, communication: 0 };
        if (!gameStats.unlockedConcepts) gameStats.unlockedConcepts = [];
      }
    }

    function saveGameStats() {
      localStorage.setItem('friendly-classroom-stats', JSON.stringify(gameStats));
    }

    function updateSkillPoints(effects, scenarioId, optionIndex) {
  // 智能 skill mapping - 根據 scenario 主題同選項 index 決定
  // Option C (index=2) 通常係最佳選擇 -> 主要增加 skills
  // Option A/B -> 較少或隨機

  const skillThemeMap = {
    's1': 'respect',    // 嘲笑→尊重
    's2': 'honesty',    // 匿贓→誠實
    's3': 'empathy',   // 新朋友→同理心
    's4': 'courage',  // 認錯→勇氣
    's5': 'kindness', // 整蠱→善良
    's6': 'communication', // 鬧交→溝通
    's7': 'empathy',  // 安慰→同理心
    's8': 'courage'  // 主動→勇氣
  };

  // 追蹤道德選擇統計（給徽章用）
  const moralChange = effects.reduce((sum, e) => sum + (e.moralChange || 0), 0);
  if (moralChange > 0) {
    if (scenarioId === 's2' || scenarioId === 's4' || scenarioId === 's-c8') choiceStats.honestChoices++;
    if (scenarioId === 's-c5' || scenarioId === 's-c6') choiceStats.braveChoices++;
    if (scenarioId === 's3' || scenarioId === 's5' || scenarioId === 's7') choiceStats.kindChoices++;
    if (scenarioId === 's-c5' || scenarioId === 's-c7') choiceStats.fairChoices++;
    if (scenarioId === 's4' || scenarioId === 's-c8') choiceStats.growthChoices++;
  }

  effects.forEach(effect => {
    if (effect.change > 0) {
      // 主要 skill 來自 scenario mapping
      let skillId = skillThemeMap[scenarioId] || Object.keys(SKILLS)[scenarioId?.charCodeAt(1) % 6 || 0];
      
      // Option C (index=2) : +1 skill guaranteed
      // Option B (index=1) : +0.4 chance
      // Option A (index=0) : negative, no skill
      
      if (optionIndex === 2) {
        // Best choice - guaranteed +1
        if (gameStats.skills[skillId] < SKILLS[skillId].max) {
          gameStats.skills[skillId]++;
          checkConceptUnlock(skillId);
          
          // 即時 check badge - 技能 MAX 時立即頒發
          checkBadgeImmediate(skillId);
          
          SoundEngine.correct();
          showParticles('positive');
        }
      } else if (optionIndex === 1 && Math.random() < 0.4) {
        // Okay choice - 40% chance
        if (gameStats.skills[skillId] < SKILLS[skillId].max) {
          gameStats.skills[skillId]++;
          if (Math.random() < 0.5) {
            checkConceptUnlock(skillId);
          }
        }
      }
      // Option A: negative, no skill increase
    }
  });
}

    // 檢查概念卡解鎖
    function checkConceptUnlock(skillId) {
      if (!skillId) return;
      const concept = CONCEPTS.find(c => c.skill === skillId && !gameStats.unlockedConcepts.includes(c.id));
      if (concept && Math.random() < 0.4) { // 40% 解鎖機會 (increased from 15%)
        gameStats.unlockedConcepts.push(concept.id);
        showBadgeNotification({ name: concept.name + '概念', emoji: concept.emoji, desc: concept.desc });
      }
    }

    // 遊戲結束時統一保存
    function finalizeGame(avgRelationship, scenarioId) {
      // 根據分數增加技能點 - 如果 avg > 50 即總體正面
      if (avgRelationship > 50) {
        const skillKeys = Object.keys(SKILLS);
        const scenario = gameData.scenarios.find(s => s.id === scenarioId);
        const primarySkill = scenarioId ? (skillKeys.find(k => k.startsWith(scenarioId?.charAt(1) || 'e'))) : skillKeys[Math.floor(Math.random() * skillKeys.length)];
        const finalSkill = primarySkill || skillKeys[Math.floor(Math.random() * skillKeys.length)];
        
        if (gameStats.skills[finalSkill] < SKILLS[finalSkill].max) {
          gameStats.skills[finalSkill] = Math.min(gameStats.skills[finalSkill] + 1, SKILLS[finalSkill].max);
          checkConceptUnlock(finalSkill);
        }
        // 連續答對 +1
        gameStats.streakCorrect++;
      } else {
        // 答錯重置連續
        gameStats.streakCorrect = 0;
      }
      // 已完成關卡數 +1
      gameStats.scenariosCompleted++;
      // 更新最高道德積分
      if (moral > gameStats.moralBest) gameStats.moralBest = moral;
      // 更新每週進度
      updateWeeklyProgress(1, moral);
      saveGameStats();
    }

    // 顯示技能進度條
    function showSkillProgress() {
      return `
        <div class="skill-progress">
          ${Object.values(SKILLS).map(s => {
            const level = gameStats.skills[s.id] || 0;
            const isMaxed = level >= s.max;
            const isUnlocked = level > 0;
            let cls = 'skill-item';
            if (isMaxed) cls += ' maxed';
            else if (isUnlocked) cls += ' unlocked';
            return `
              <div class="${cls}">
                <span class="skill-emoji">${isUnlocked ? s.emoji : '❓'}</span>
                <span class="skill-name">${s.name}</span>
                <span class="skill-level">${level}/${s.max}</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // 顯示概念卡牌
    function showConceptCards() {
      if (gameStats.unlockedConcepts.length === 0) return '';
      const unlocked = CONCEPTS.filter(c => gameStats.unlockedConcepts.includes(c.id));
      return `
        <div class="concept-cards">
          ${unlocked.map(c => `
            <div class="concept-card unlocked">
              <span class="card-emoji">${c.emoji}</span>
              <span class="card-name">${c.name}</span>
              <div class="card-tooltip">${c.desc}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 粒子效果
    function showParticles(type) {
      // Check for reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      
      const container = document.createElement('div');
      container.className = 'particles-container';
      document.body.appendChild(container);
      
      const emojis = type === 'positive' ? ['✨','⭐','💫','🌟'] : ['💔','🌧️','❄️'];
      const colors = type === 'positive' ? ['#ffd93f','#4caf50','#e87830'] : ['#e83838','#6b4f3a'];
      
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        particle.style.left = (20 + Math.random() * 60) + '%';
        particle.style.top = (20 + Math.random() * 60) + '%';
        particle.style.color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
        particle.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
        container.appendChild(particle);
      }
      
      setTimeout(() => container.remove(), 1000);
    }

    // 螢幕震動
    function triggerShake() {
      // Check for reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 300);
    }

    // Check and award badges
    function checkBadges() {
      const newBadges = [];
      for (const badge of BADGES) {
        if (!gameStats.badges.includes(badge.id) && badge.condition(gameStats)) {
          gameStats.badges.push(badge.id);
          newBadges.push(badge);
        }
      }
      return newBadges;
    }
    
    // 即時頒發 badge - 技能 MAX 時立即彈出通知
    function checkBadgeImmediate(skillId) {
      // 搵呢個 skill 對應既 badge
      const skillBadgeMap = {
        empathy: 'empathy_master',
        respect: 'respect_master',
        courage: 'courage_master',
        honesty: 'honesty_master',
        kindness: 'kindness_master',
        communication: 'communication_master'
      };
      
      const badgeId = skillBadgeMap[skillId];
      if (!badgeId) return;
      
      // Check if skill reached MAX and badge not yet awarded
      if ((gameStats.skills[skillId] || 0) >= 5 && !gameStats.badges.includes(badgeId)) {
        const badge = BADGES.find(b => b.id === badgeId);
        if (badge) {
          gameStats.badges.push(badgeId);
          saveGameStats(); // 立即 save
          showBadgeNotification(badge); // 即時彈出
        }
      }
    }

    function startGame(location) {

      // Capture player name at game start
      getPlayerName();
      
      try {
        // 清除開始畫面
        const startScreen = document.getElementById('start-screen');
        if (startScreen) startScreen.remove();
        
        // 确保 gameData 已加载
        if (!gameData.scenarios || gameData.scenarios.length === 0) {
          loadScenarios();
        }
        
        // 根據 location 篩選場景
        let filteredScenarios = gameData.scenarios;
        if (location && location !== 'random') {
          filteredScenarios = gameData.scenarios.filter(s => s.location === location);
          if (filteredScenarios.length === 0) {
            // 如果冇呢個 location 既場景就用全部
            filteredScenarios = gameData.scenarios;
          }
        }
        
        // 隨機打亂場景順序
        if (location === 'random') {
          filteredScenarios = [...filteredScenarios].sort(() => Math.random() - 0.5);
        }
        
        const firstScenario = filteredScenarios[0];
        if (firstScenario && firstScenario.characters) {
          firstScenario.characters.forEach(char => {
            if (relationships[char.name] === undefined) {
              relationships[char.name] = char.initial_relationship;
            }
          });
        }
        
        // 显示关系值和第一个场景

// TTS - 讀出情景文字
    function speakText(e) {
      // Skip if already speaking
      if (window.__ttsSpeaking) return;
      window.__ttsSpeaking = true;
      
      try {
        // 从 div 直接获取 textContent (避免 innerText 既递归问题)
        const bubble = document.querySelector('.dialogue-bubble');
        const textEl = document.getElementById('scenario-text');
        const descEl = document.querySelector('.scenario-desc');
        
        const text = (bubble?.textContent || textEl?.textContent || descEl?.textContent || '').trim();
        if (!text) return;
        
        if (!settings.soundEnabled) return;
        
        const btn = e?.target;
        if (btn) btn.classList.add('speaking');
        
        // 使用 Web Speech API
        if ('speechSynthesis' in window) {
          // 先取消之前既 speech
          speechSynthesis.cancel();
          
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-HK';
          utterance.rate = settings.speechRate || 0.9;
          utterance.pitch = 1;
          
          utterance.onend = () => { 
            window.__ttsSpeaking = false;
            btn?.classList.remove('speaking'); 
          };
          utterance.onerror = (e) => { 
            window.__ttsSpeaking = false;
            btn?.classList.remove('speaking'); 
          };
          speechSynthesis.speak(utterance);
        }
      } catch(err) {
        window.__ttsSpeaking = false;
      }
    }

    // 直接讀指定文字（用於選項讀音）
    function speakTextDirect(text) {
      if (!text || window.__ttsSpeaking) return;
      window.__ttsSpeaking = true;
      try {
        if ('speechSynthesis' in window) {
          speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-HK';
          utterance.rate = settings.speechRate || 0.9;
          utterance.pitch = 1;
          utterance.onend = () => { window.__ttsSpeaking = false; };
          utterance.onerror = () => { window.__ttsSpeaking = false; };
          speechSynthesis.speak(utterance);
        }
      } catch(err) {
        window.__ttsSpeaking = false;
      }
    }

    let currentBgm = null;
    function playBgm(type) {
      if (!settings.bgmEnabled) return;
      stopBgm();
      const bgmFiles = {
        menu: 'assets/bgm/menu-start.mp3',
        classroom: 'assets/bgm/classroom-cheerful.mp3',
        break: 'assets/bgm/break-time-fun.mp3',
        achievement: 'assets/bgm/achievement-proud.mp3',
        calm: 'assets/bgm/calm-focus.mp3'
      };
      const file = bgmFiles[type];
      if (!file) return;
      currentBgm = new Audio(file);
      currentBgm.loop = true;
      currentBgm.volume = 0.4;
      currentBgm.play().catch(() => {});

    function stopBgm() {

    // 顯示提示 (Tier 1 by default)
    function showHint(e) {

    // 3-Tier ARPG Hint System
    let currentHintTier = 0;

    function showHintTier(tier) {
      if (tier < 1 || tier > 3) return;
      if (currentHintTier >= tier) return; // Already unlocked this tier or higher

      const hintBox = document.getElementById('hint-box');
      const hintContainer = document.getElementById('hint-container');
      if (!hintBox || !hintContainer) return;

      // Get hints from scenario
      const scenario = currentScenario;
      const hints = scenario?.hints || [scenario?.hint || '試下諗下，如果係你，你會點樣做？'];

      // Unlock tiers progressively (tier 1 unlocks tier 2, tier 2 unlocks tier 3)
      currentHintTier = tier;

      // Update tier buttons
      const tierBtns = hintContainer.querySelectorAll('.hint-tier-btn');
      tierBtns.forEach((btn, i) => {
        btn.classList.remove('active', 'locked');
        if (i + 1 < tier) {
          btn.classList.add('active'); // Already used tiers
        } else if (i + 1 === tier) {
          btn.classList.add('active'); // Current tier
        } else {
          btn.classList.add('locked'); // Locked tiers
        }
      });

      // Get hint content for this tier (0-indexed array access)
      const hintIndex = tier - 1;
      const hintContent = hints[hintIndex] || hints[hints.length - 1] || '試下諗下，如果係你，你會點樣做？';
      const tierLabel = tier === 1 ? '💡 輕輕暗示' : tier === 2 ? '💡💡 道德提示' : '💡💡💡 行動建議';
      const tierDesc = tier === 1 ? '輕輕提示方向...' : tier === 2 ? '呢個選擇關乎...?' : '建議選擇：';

      // Update hint box with tier class and content
      hintBox.className = 'hint-box show tier-' + tier;
      hintBox.innerHTML = `
        <div class="hint-text-tier current">
          <div style="color:var(--yellow);font-size:12px;margin-bottom:8px;">${tierLabel}</div>
          <div style="font-size:13px;">${tierDesc}</div>
          <div style="margin-top:8px;">${hintContent}</div>
        </div>
      `;

      // Play hint sound
      AudioSys.click();
    }

// 選擇選項
    function chooseOption(scenarioId, optionId) {
      // Sound first (user feedback before anything else)
      SoundEngine.click();
      AudioSys.click();
      // Disable buttons immediately to prevent double-tap
      document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
      document.querySelectorAll('.option-speak-btn').forEach(b => b.style.pointerEvents = 'none');

      const scenario = gameData.scenarios.find(s => s.id === scenarioId);
      if (!scenario) return;

      const option = scenario.options.find(o => o.id === optionId);
      if (!option) return;

      // Get option index for skill calculation
      const optionIndex = scenario.options.findIndex(o => o.id === optionId);

      // 保存選擇前既關係值（用于重試）
      previousRelationships = JSON.parse(JSON.stringify(relationships));
      previousMoral = moral;

      // 應用效果
      const totalChange = option.effects.reduce((sum, e) => sum + e.change, 0);
      option.effects.forEach(effect => {
        relationships[effect.character] = (relationships[effect.character] || 50) + effect.change;
        relationships[effect.character] = Math.max(-100, Math.min(100, relationships[effect.character]));
      });
      // 道德值變化（每個effect可選moralChange欄位）
      let moralChange = 0;
      option.effects.forEach(effect => {
        if (effect.moralChange) moralChange += effect.moralChange;
      });
      moral = Math.max(0, Math.min(100, moral + moralChange));
      
      // 更新技能點數 - passing scenarioId 同 optionIndex
      updateSkillPoints(option.effects, scenarioId, optionIndex);
      
      // 視覺效果：正向=粒子+綠光閃爍 / 負向=震動+紅閃爍
      const gameArea = document.getElementById('game-area');
      if (totalChange > 0) {
        showParticles('positive');
        gameArea.classList.add('positive-flash');
        setTimeout(() => gameArea.classList.remove('positive-flash'), 500);
      } else if (totalChange < 0) {
        AudioSys.fail();
        triggerShake();
        gameArea.classList.add('negative-flash');
        setTimeout(() => gameArea.classList.remove('negative-flash'), 400);
      }
      
      // Mark as completed
      if (!completedScenarios.includes(scenarioId)) {
        completedScenarios.push(scenarioId);
      }

      saveRelationships();
      showRelationships();
      checkMoralBadges(); // 檢查道德徽章

      showResult(option.effects, () => {
        const nextId = option.next_scenario;
        const nextScenario = nextId ? gameData.scenarios.find(s => s.id === nextId) : null;

        if (nextScenario) {
          nextScenario.characters.forEach(char => {
            if (relationships[char.name] === undefined) {
              relationships[char.name] = char.initial_relationship;
            }
          });
          showScenario(nextScenario);
        } else {
          checkEnding();
        }
      });
    }

// 顯示結果 - FeedbackModal 兩階段顯示
    function showResult(effects, onContinue) {
      const gameArea = document.getElementById('game-area');

      //.Play success/fail sound based on effect
      const totalChange = effects.reduce((sum, e) => sum + e.change, 0);
      if (totalChange > 0) { AudioSys.success(); playBgm('achievement'); }
      else if (totalChange < 0) { AudioSys.fail(); playBgm('calm'); }
      setTimeout(() => stopBgm(), 4000); // Stop BGM after 4 seconds

      // 第一階段：後果敘述
      const comments = effects.map(e => {
        const emoji = getCharacterEmoji(e.character);
        const change = e.change;
        const changeText = change > 0 ? `+${change}` : change;
        return `<strong>${emoji} ${e.character}:</strong> ${e.comment} <span class="change-amount">(${changeText}❤️)</span>`;
      }).join('<br><br>');
      
      // Select epic ARPG phrase + color based on outcome
      const isPositive = totalChange > 0;
      const epicPhrases = isPositive
        ? ['⚔️ 完美出招！', '✨ 暴擊成功！', '🌟 好感度UP！', '💥 關係大增！', '🎯 精準打擊！']
        : ['💔 被反擊了...', '⚡ 生命值減少...', '💨 攻擊失敗...', '🌊 形勢逆轉...'];
      const colorClass = isPositive ? 'title-positive' : 'title-negative';
      const epicTitle = epicPhrases[Math.floor(Math.random() * epicPhrases.length)];

      gameArea.innerHTML = `
        <div class="result-overlay show">
          <div class="result-card feedback-modal">
            <div class="feedback-stage stage-consequence">
              <div class="feedback-title ${colorClass}">${epicTitle}</div>

    // 完成Feedback，進入下一個情景
    function finishFeedback(btn) {
      btn.closest('.result-overlay').remove();
      currentOnContinue?.();
    }

    // 重試（返回選擇）
    function retryChoice() {
      // 恢復關係值到選擇前
      if (previousRelationships) {
        relationships = JSON.parse(JSON.stringify(previousRelationships));
        moral = previousMoral;
        saveRelationships();
        showRelationships();
        // 移除彈窗
        document.querySelector('.result-overlay')?.remove();
        // 自動朗讀提示（張鈞保語音強化模式）
        if (currentScenario?.hints && settings.autoVoiceRead) {
          const tier2Hint = currentScenario.hints[1] || currentScenario.hints[0];
          if (tier2Hint) {
            setTimeout(() => speakTextDirect(tier2Hint), 300);
          }
        }
        // 重新顯示當前情景
        showScenario(currentScenario);
      } else {
        // 如果冇 previousRelationships，直接 close modal 同 reload scenario
        document.querySelector('.result-overlay')?.remove();
        if (currentScenario) {
          // 自動朗讀提示（張鈞保語音強化模式）
          if (currentScenario?.hints && settings.autoVoiceRead) {
            const tier2Hint = currentScenario.hints[1] || currentScenario.hints[0];
            if (tier2Hint) {
              setTimeout(() => speakTextDirect(tier2Hint), 300);
            }
          }
          showScenario(currentScenario);
        }
      }
    }

        restartGame();
      } catch (e) {
        alert('❌ JSON 錯誤: ' + e.message);
      }
    }

    // 啟動
    window.onload = init;
  </script>
