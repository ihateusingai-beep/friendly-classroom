<html lang="zh-HK">
<head><script>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){

    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友愛教室 - 像素大冒險</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+HK:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #2d1b0e;
      --bg-mid: #4a3728;
      --bg-light: #6b4f3a;
      --cream: #f5d89a;
      --cream-dark: #d4a855;
      --orange: #e87830;
      --orange-dark: #b85a20;
      --yellow: #ffd93f;
      --red: #e83838;
      --green: #4caf50;
      --white: #fff8e0;
      --shadow: #1a0f07;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'Pixel';
      src: local('Press Start 2P'), local('Courier New');
    }

    body {
      font-family: 'Noto Sans HK', 'PingFang HK', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      padding: 20px;
      background-image: 
        linear-gradient(45deg, #3d2514 25%, transparent 25%),
        linear-gradient(-45deg, #3d2514 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #3d2514 75%),
        linear-gradient(-45deg, transparent 75%, #3d2514 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* 像素風標題 */
    .header {
      text-align: center;
      margin-bottom: 30px;
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 20px;
      box-shadow: 
        8px 8px 0 var(--shadow),
        -4px -4px 0 var(--cream-dark);
    }

    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--orange-dark);
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .header p {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
    }

    /* 像素心仔 */
    .pixel-heart {
      display: inline-block;
      width: 20px;
      height: 20px;
      background: var(--red);
      position: relative;
      transform: rotate(45deg);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .pixel-heart::before,
    .pixel-heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--red);
      border-radius: 50%;
    }

    .pixel-heart::before {
      left: -10px;
    }

    .pixel-heart::after {
      top: -10px;
    }

    /* 關係值卡 */
    .relationships {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .char-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 15px 20px;
      text-align: center;
      box-shadow: 6px 6px 0 var(--shadow);
    }

    .char-emoji {
      font-size: 40px;
      margin-bottom: 8px;
      image-rendering: pixelated;
    }

    .char-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
      margin-bottom: 10px;
    }

    .char-bar-container {
      width: 100%;
      height: 16px;
      background: var(--bg-dark);
      border: 2px solid var(--cream);
      position: relative;
    }

    .char-bar-fill {
      height: 100%;
      background: var(--green);
      transition: width 0.3s steps(10);
    }

    .char-bar-fill.low { background: var(--red); }
    .char-bar-fill.medium { background: var(--orange); }
    .char-bar-fill.high { background: var(--green); }

    .char-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--white);
      margin-top: 5px;
    }

    /* 情景卡 */
    .scenario-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 30px;
      box-shadow: 8px 8px 0 var(--shadow);
    }

    .scenario-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 20px;
      text-align: center;
    }

    .scenario-desc {
      font-size: 20px;
      color: var(--white);
      line-height: 1.8;
      margin-bottom: 30px;
      text-align: center;
      background: var(--bg-dark);
      padding: 20px;
      border: 2px solid var(--bg-light);
    }

    /* 像素選項按鈕 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option-btn {
      background: var(--bg-dark);
      border: 4px solid var(--cream);
      padding: 20px 25px;
      font-family: 'Noto Sans HK', sans-serif;
      font-size: 18px;
      color: var(--white);
      cursor: pointer;
      transition: all 0.1s steps(5);
      text-align: left;
      position: relative;
    }

    .option-btn::before {
      content: '►';
      position: absolute;
      left: 10px;
      color: var(--yellow);
    }

    .option-btn:hover {
      background: var(--bg-light);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--shadow);
    }

    .option-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .option-letter {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--yellow);
      margin-right: 10px;
    }

    /* 結果彈窗 */
    .result-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .result-overlay.show {
      display: flex;
    }

    .result-card {
      background: var(--bg-mid);
      border: 4px solid var(--cream);
      padding: 40px;
      max-width: 600px;
      text-align: center;
      box-shadow: 8px 8px 0 var(--shadow);
    }

    /* FeedbackModal 樣式 */
    .feedback-modal {
      max-width: 550px;
    }

    .feedback-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 20px;
    }

    .change-amount {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
    }
    .change-amount.positive { color: var(--green); }
    .change-amount.negative { color: var(--red); }

    .guidance-tip {
      font-size: 20px;
      color: var(--white);
      line-height: 1.8;
      margin: 25px 0;
      padding: 20px;
      background: var(--bg-dark);
      border: 2px dashed var(--yellow);
    }

    .retry-btn {
      background: transparent;
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 12px 25px;
      font-family: 'Noto Sans HK', sans-serif;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .retry-btn:hover {
      background: var(--bg-light);
    }

    /* QuestionCard 元件 */
    .question-tools {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      color: var(--cream);
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: var(--bg-light);
      border-color: var(--yellow);
    }

    .tool-btn.speaking {
      background: var(--orange);
      border-color: var(--yellow);
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .hint-box {
      background: rgba(255, 217, 63, 0.1);
      border: 2px dashed var(--yellow);
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      color: var(--yellow);
      display: none;
    }

    .hint-box.show {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SceneCard 元件 */
    .scene-card {
      margin-bottom: 30px;
    }

    /* 角色展示區 */
    .character-stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      min-height: 120px;
      margin-bottom: 25px;
      padding: 20px;
      background: var(--bg-dark);
      border: 3px solid var(--bg-light);
      border-radius: 15px;
      position: relative;
    }

    .character-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s;
    }

    .character-avatar.speaking {
      transform: scale(1.1);
    }

    .character-avatar Emoji {
      font-size: 64px;
      filter: drop-shadow(3px 3px 0 var(--shadow));
    }

    .character-avatar.speaking Emoji {
      animation: bounce 0.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .character-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--cream);
      margin-top: 8px;
      background: var(--bg-mid);
      padding: 5px 10px;
      border-radius: 5px;
    }

    /* 對話氣泡 */
    .dialogue-bubble {
      background: white;
      color: var(--bg-dark);
      padding: 15px 20px;
      border-radius: 20px;
      position: relative;
      max-width: 80%;
      font-size: 18px;
      line-height: 1.5;
      margin: 10px auto;
    }

    .dialogue-bubble::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-bottom-color: white;
    }

    .dialogue-bubble.from-player {
      background: var(--cream);
      align-self: flex-end;
    }

    .dialogue-bubble.from-npc {
      background: var(--white);
      align-self: flex-start;
    }

    /* 場景背景描述 */
    .scene-background {
      font-size: 14px;
      color: var(--bg-light);
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Press Start 2P', monospace;
    }

    /* 開始畫面 */
    .start-screen {
      text-align: center;
      padding: 40px;
    }

    .start-screen h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--yellow);
      margin-bottom: 20px;
    }

    .start-screen p {
      font-size: 18px;
      color: var(--cream);
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .start-btn {
      background: var(--green);
      border: 4px solid var(--yellow);
      padding: 20px 60px;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: var(--white);
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 6px 6px 0 var(--shadow);
      transition: all 0.2s;
    }

    .start-btn:hover {
      background: var(--orange);
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    /* 場景選擇 */
    .location-selection { margin: 20px 0; }
    .location-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .location-btn { background: var(--bg-mid); border: 3px solid var(--cream-dark); color: var(--cream); padding: 12px 20px; font-family: 'Noto Sans HK', sans-serif; font-size: 14px; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .location-btn:hover { background: var(--bg-light); border-color: var(--yellow); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--shadow); }

    /* SettingsPanel 側邊欄 */
    .settings-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-mid);
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      z-index: 50;
      transition: all 0.2s;
    }

    .settings-toggle:hover {
      background: var(--bg-light);
    }

    .settings-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100vh;
      background: var(--bg-mid);
      border-left: 4px solid var(--cream);
      padding: 30px 20px;
      z-index: 100;
      transition: right 0.3s ease;
      overflow-y: auto;
      box-shadow: -8px 0 30px rgba(0,0,0,0.5);
    }

    .settings-panel.open {
      right: 0;
    }

    .settings-panel h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 25px;
      text-align: center;
    }

    .settings-section {
      margin-bottom: 25px;
    }

    .settings-label {
      font-size: 14px;
      color: var(--cream);
      margin-bottom: 10px;
      display: block;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* 字體滑桿 */
    .font-slider {
      width: 100%;
      height: 10px;
      -webkit-appearance: none;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 5px;
      outline: none;
    }

    .font-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--orange);
      border: 2px solid var(--yellow);
      border-radius: 50%;
      cursor: pointer;
    }

    .font-size-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--orange);
      text-align: center;
      margin-top: 5px;
    }

    /* 語速滑桿 */
    .speed-slider {
      width: 100%;
      height: 10px;
      -webkit-appearance: none;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 5px;
      outline: none;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--green);
      border: 2px solid var(--yellow);
      border-radius: 50%;
      cursor: pointer;
    }

    .speed-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--green);
      text-align: center;
      margin-top: 5px;
    }

    /* 開關 toggle */
    .toggle-switch {
      position: relative;
      width: 60px;
      height: 30px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 30px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      position: absolute;
      content: '';
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background: var(--cream);
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--green);
      border-color: var(--green);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(30px);
    }

    .settings-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: var(--cream);
      font-size: 24px;
      cursor: pointer;
    }

    .settings-close:hover {
      color: var(--yellow);
    }

    .result-comment {
      font-size: 22px;
      color: var(--white);
      line-height: 1.8;
      margin: 25px 0;
    }

    .result-comment strong {
      color: var(--yellow);
    }

    .continue-btn {
      background: var(--orange);
      border: 4px solid var(--yellow);
      padding: 15px 40px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--white);
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--shadow);
    }

    .continue-btn:hover {
      background: var(--orange-dark);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--shadow);
    }

    /* 結局 */
    .ending-card {
      background: var(--bg-mid);
      border: 4px solid var(--yellow);
      padding: 40px;
      text-align: center;
      box-shadow: 8px 8px 0 var(--shadow);
      background: linear-gradient(180deg, var(--bg-mid) 0%, var(--orange-dark) 100%);
    }

    .ending-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: var(--yellow);
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 var(--shadow);
    }

    .ending-desc {
      font-size: 20px;
      color: var(--white);
      line-height: 1.8;
    }

    .restart-btn {
      background: var(--green);
      border: 4px solid var(--white);
      padding: 15px 35px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--white);
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 4px 4px 0 var(--shadow);
    }

    .restart-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--shadow);
    }

    /* Teacher Mode */
    .home-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      background: var(--bg-dark);
      color: var(--cream);
      border: 2px solid var(--cream);
      cursor: pointer;
    }
    .home-btn:hover {
      background: var(--cream);
      color: var(--bg-dark);
    }

    /* Progress Bar */
    .progress-container { margin-bottom: 15px; }
    .progress-label { font-size: 12px; color: var(--cream); margin-bottom: 5px; }
    .progress-bar { height: 12px; background: var(--bg-dark); border: 2px solid var(--cream); border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); transition: width 0.3s ease; }

    /* Learning Points */
    .learning-points {
      margin: 20px 0;
      padding: 15px;
      background: var(--bg-mid);
      border: 2px solid var(--yellow);
      border-radius: 8px;
    }

    /* Relationship Bar */
    .relationship-bar-container {
      right: 15px;
      background: var(--bg-mid);
      border: 2px solid var(--cream);
      color: var(--cream);
      padding: 8px 15px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
    }

    .admin-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      padding: 30px;
      color: var(--white);
      overflow: auto;
      z-index: 200;
    }

    .admin-panel.show {
      display: block;
    }

    .admin-panel textarea {
      width: 100%;
      height: 50vh;
      font-size: 14px;
      font-family: monospace;
      background: var(--bg-mid);
      color: var(--cream);
      border: 2px solid var(--cream);
      padding: 15px;
    }

    .admin-panel h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--yellow);
      margin-bottom: 15px;
    }

    .admin-panel button {
      background: var(--orange);
      border: 2px solid var(--yellow);
      color: var(--white);
      padding: 12px 25px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 15px;
    }

    /* 動畫 - 像素閃爍 */
    @keyframes pixel-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .blink {
      animation: pixel-blink 1s steps(2) infinite;
    }

    /* 像素裝飾 */
    .pixel-decor {
      position: fixed;
      font-size: 24px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* 響應式 */
    @media (min-width: 768px) {
      .header h1 { font-size: 28px; }
      .scenario-card { padding: 40px; }
      .scenario-desc { font-size: 22px; }
    }

    /* Certificate Styles */
    .cert {
      background: linear-gradient(180deg, #1a472a 0%, #2d1b0e 100%);
      border: 8px solid var(--cream);
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      max-width: 500px;
      margin: 0 auto;
    }
    .cert.gold { border-color: #ffd700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.5); }

    // 讀取情景數據
    function loadScenarios() {
      // 直接使用內置數據，唔再 fetch
      gameData = getDefaultScenarios();
      totalScenarios = gameData.scenarios.length; // 動態計算總關卡數
      buildCharacterCache();
    }
    
    // Build character emoji cache for O(1) lookup
    function buildCharacterCache() {
      characterEmojiCache = {};
      for (const scenario of gameData.scenarios) {
        if (scenario.characters) {
          for (const char of scenario.characters) {
            characterEmojiCache[char.name] = char.emoji;
          }
        }
      }
    }

    // 讀取關係值
    function loadRelationships() {
      const saved = localStorage.getItem('friendly-classroom-v2');
      if (saved) {
        relationships = JSON.parse(saved);
      }
    }

    // 儲存關係值
    function saveRelationships() {
      localStorage.setItem('friendly-classroom-v2', JSON.stringify(relationships));
    }

    // Load/Save Game Stats
    function loadGameStats() {
      const saved = localStorage.getItem('friendly-classroom-stats');
      if (saved) {
        const parsed = JSON.parse(saved);
        // 兼容舊既存檔 + 新既欄位
        gameStats = { ...gameStats, ...parsed };
        if (!gameStats.skills) gameStats.skills = { empathy: 0, respect: 0, courage: 0, honesty: 0, kindness: 0, communication: 0 };
        if (!gameStats.unlockedConcepts) gameStats.unlockedConcepts = [];
      }
    }

    function saveGameStats() {
      localStorage.setItem('friendly-classroom-stats', JSON.stringify(gameStats));
    }

    function updateSkillPoints(effects, scenarioId, optionIndex) {
  // 智能 skill mapping - 根據 scenario 主題同選項 index 決定
  // Option C (index=2) 通常係最佳選擇 -> 主要增加 skills
  // Option A/B -> 較少或隨機
  
  const skillThemeMap = {
    's1': 'respect',    // 嘲笑→尊重
    's2': 'honesty',    // 匿贓→誠實
    's3': 'empathy',   // 新朋友→同理心
    's4': 'courage',  // 認錯→勇氣
    's5': 'kindness', // 整蠱→善良
    's6': 'communication', // 鬧交→溝通
    's7': 'empathy',  // 安慰→同理心
    's8': 'courage'  // 主動→勇氣
  };

  effects.forEach(effect => {
    if (effect.change > 0) {
      // 主要 skill 來自 scenario mapping
      let skillId = skillThemeMap[scenarioId] || Object.keys(SKILLS)[scenarioId?.charCodeAt(1) % 6 || 0];
      
      // Option C (index=2) : +1 skill guaranteed
      // Option B (index=1) : +0.4 chance
      // Option A (index=0) : negative, no skill
      
      if (optionIndex === 2) {
        // Best choice - guaranteed +1
        if (gameStats.skills[skillId] < SKILLS[skillId].max) {
          gameStats.skills[skillId]++;
          checkConceptUnlock(skillId);
          
          // 即時 check badge - 技能 MAX 時立即頒發
          checkBadgeImmediate(skillId);
          
          showParticles('positive');
        }
      } else if (optionIndex === 1 && Math.random() < 0.4) {
        // Okay choice - 40% chance
        if (gameStats.skills[skillId] < SKILLS[skillId].max) {
          gameStats.skills[skillId]++;
          if (Math.random() < 0.5) {
            checkConceptUnlock(skillId);
          }
        }
      }
      // Option A: negative, no skill increase
    }
  });
}

    // 檢查概念卡解鎖
    function checkConceptUnlock(skillId) {
      if (!skillId) return;
      const concept = CONCEPTS.find(c => c.skill === skillId && !gameStats.unlockedConcepts.includes(c.id));
      if (concept && Math.random() < 0.4) { // 40% 解鎖機會 (increased from 15%)
        gameStats.unlockedConcepts.push(concept.id);
        showBadgeNotification({ name: concept.name + '概念', emoji: concept.emoji, desc: concept.desc });
      }
    }

    // 遊戲結束時統一保存
    function finalizeGame(avgRelationship, scenarioId) {
      // 根據分數增加技能點 - 如果 avg > 50 即總體正面
      if (avgRelationship > 50) {
        const skillKeys = Object.keys(SKILLS);
        const scenario = gameData.scenarios.find(s => s.id === scenarioId);
        const primarySkill = scenarioId ? (skillKeys.find(k => k.startsWith(scenarioId?.charAt(1) || 'e'))) : skillKeys[Math.floor(Math.random() * skillKeys.length)];
        const finalSkill = primarySkill || skillKeys[Math.floor(Math.random() * skillKeys.length)];
        
        if (gameStats.skills[finalSkill] < SKILLS[finalSkill].max) {
          gameStats.skills[finalSkill] = Math.min(gameStats.skills[finalSkill] + 1, SKILLS[finalSkill].max);
          checkConceptUnlock(finalSkill);
        }
      }
      saveGameStats();
    }

    // 顯示技能進度條
    function showSkillProgress() {
      return `
        <div class="skill-progress">
          ${Object.values(SKILLS).map(s => {
            const level = gameStats.skills[s.id] || 0;
            const isMaxed = level >= s.max;
            const isUnlocked = level > 0;
            let cls = 'skill-item';
            if (isMaxed) cls += ' maxed';
            else if (isUnlocked) cls += ' unlocked';
            return `
              <div class="${cls}">
                <span class="skill-emoji">${isUnlocked ? s.emoji : '❓'}</span>
                <span class="skill-name">${s.name}</span>
                <span class="skill-level">${level}/${s.max}</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // 顯示概念卡牌
    function showConceptCards() {
      if (gameStats.unlockedConcepts.length === 0) return '';
      const unlocked = CONCEPTS.filter(c => gameStats.unlockedConcepts.includes(c.id));
      return `
        <div class="concept-cards">
          ${unlocked.map(c => `

            </div>
          `).join('')}
        </div>
      `;
    }

    // 粒子效果
    function showParticles(type) {
      // Check for reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      
      const container = document.createElement('div');
      container.className = 'particles-container';
      document.body.appendChild(container);
      
      const emojis = type === 'positive' ? ['✨','⭐','💫','🌟'] : ['💔','🌧️','❄️'];
      const colors = type === 'positive' ? ['#ffd93f','#4caf50','#e87830'] : ['#e83838','#6b4f3a'];
      
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        particle.style.left = (20 + Math.random() * 60) + '%';
        particle.style.top = (20 + Math.random() * 60) + '%';
        particle.style.color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
        particle.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
        container.appendChild(particle);
      }
      
      setTimeout(() => container.remove(), 1000);
    }

    // 螢幕震動
    function triggerShake() {
      // Check for reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 300);
    }

    // Check and award badges
    function checkBadges() {
      const newBadges = [];
      for (const badge of BADGES) {
        if (!gameStats.badges.includes(badge.id) && badge.condition(gameStats)) {
          gameStats.badges.push(badge.id);
          newBadges.push(badge);
        }
      }
      return newBadges;
    }
    
    // 即時頒發 badge - 技能 MAX 時立即彈出通知
    function checkBadgeImmediate(skillId) {
      // 搵呢個 skill 對應既 badge
      const skillBadgeMap = {
        empathy: 'empathy_master',
        respect: 'respect_master',
        courage: 'courage_master',
        honesty: 'honesty_master',
        kindness: 'kindness_master',
        communication: 'communication_master'
      };
      
      const badgeId = skillBadgeMap[skillId];
      if (!badgeId) return;
      
      // Check if skill reached MAX and badge not yet awarded
      if ((gameStats.skills[skillId] || 0) >= 5 && !gameStats.badges.includes(badgeId)) {
        const badge = BADGES.find(b => b.id === badgeId);
        if (badge) {
          gameStats.badges.push(badgeId);
          saveGameStats(); // 立即 save
          showBadgeNotification(badge); // 即時彈出
        }
      }
    }

    // Show badge notification
    function showBadgeNotification(badge) {
      AudioSys.badge(); // Play badge sound
      
      const gameArea = document.getElementById('game-area');

      if (existing) existing.remove();

          🎖️ 獲得徽章: ${badge.emoji} ${badge.name}!
        </div>
      `;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    // Add slideIn animation
    const style = document.createElement('style');
    style.textContent = '@keyframes slideIn { from { transform:translateX(100px);opacity:0; } to { transform:translateX(0);opacity:1; } }';
    document.head.appendChild(style);

    // 開始遊戲
    function startGame(location) {
      console.log('[DEBUG] startGame called with location:', location);
      location = location || 'random';
      
      // Capture player name at game start
      getPlayerName();
      
      try {
        // 清除開始畫面
        const startScreen = document.getElementById('start-screen');
        if (startScreen) startScreen.remove();
        
        // 确保 gameData 已加载
        if (!gameData.scenarios || gameData.scenarios.length === 0) {
          console.log('[DEBUG] Loading scenarios...');
          loadScenarios();
        }
        
        // 根據 location 篩選場景
        let filteredScenarios = gameData.scenarios;
        if (location && location !== 'random') {
          filteredScenarios = gameData.scenarios.filter(s => s.location === location);
          if (filteredScenarios.length === 0) {
            // 如果冇呢個 location 既場景就用全部
            filteredScenarios = gameData.scenarios;
          }
        }
        
        // 隨機打亂場景順序
        if (location === 'random') {
          filteredScenarios = [...filteredScenarios].sort(() => Math.random() - 0.5);
        }
        
        const firstScenario = filteredScenarios[0];
        if (firstScenario && firstScenario.characters) {
          firstScenario.characters.forEach(char => {
            if (relationships[char.name] === undefined) {
              relationships[char.name] = char.initial_relationship;
            }
          });
        }
        
        // 显示关系值和第一个场景
        showRelationships();
        showScenario(firstScenario);
        
        console.log('[DEBUG] Game started successfully');
      } catch (e) {
        console.error('[ERROR] startGame:', e);
        alert('Error: ' + e.message);
      }
    }

    // 顯示關係值
    function showRelationships() {
      const container = document.getElementById('relationships');

      if (chars.length === 0) {
        container.innerHTML = '<p style="color:var(--cream);font-size:14px;">Loading...</p>';
        return;
      }

      container.innerHTML = chars.map(name => {
        const value = Math.max(0, Math.min(100, relationships[name]));
        const emoji = getCharacterEmoji(name);
        let barClass = 'high';
        if (value < 30) barClass = 'low';
        else if (value < 60) barClass = 'medium';
        
        return `
          <div class="char-card">
            <div class="char-emoji">${emoji}</div>
            <div class="char-name">${name}</div>
            <div class="char-bar-container">
              <div class="char-bar-fill ${barClass}" style="width: ${value}%"></div>
            </div>
            <div class="char-value">${value}%</div>
          </div>
        `;
      }).join('');
    }

    // 獲取角色emoji - O(1) from cache
    function getCharacterEmoji(name) {
      return characterEmojiCache[name] || '👤';
    }

    // 顯示情景 - SceneCard 版本
    function showScenario(scenario) {
      if (!scenario) {
        checkEnding();
        return;
      }
      
      // Skip if already completed
      if (completedScenarios.includes(scenario.id)) {
        const nextId = scenario.options[0]?.next_scenario;
        const next = gameData.scenarios.find(s => s.id === nextId);
        if (next) { showScenario(next); return; }
      }
      
      currentScenario = scenario;
      currentScenarioNum = (currentScenarioNum || 0) + 1;
      
      const gameArea = document.getElementById('game-area');

      // 收集情景中的角色
      const chars = scenario.characters || [];
      const charHTML = chars.map(c => `
        <div class="character-avatar" id="char-${c.name}">
          <span class="char-emoji">${c.emoji}</span>
          <div class="character-label">${c.name}</div>
        </div>
      `).join('');

      gameArea.innerHTML = `
        <div class="scenario-card">
          <!-- Progress Bar -->
          <div class="progress-container">
            <div class="progress-label">關卡進度：${currentScenarioNum}/${totalScenarios}</div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${(currentScenarioNum/totalScenarios)*100}%"></div>

            <div class="dialogue-bubble from-npc">

    // 角色說話動畫
    function animateCharacterSpeak(charName, isSpeaking) {
      const charEl = document.getElementById(`char-${charName}`);
      if (charEl) {
        if (isSpeaking) {
          charEl.classList.add('speaking');
        } else {
          charEl.classList.remove('speaking');
        }
      }
    }
    
    // TTS - 讀出情景文字
    function speakText(e) {
      // 首先尝试从 dialogue-bubble 获取文本（角色对话）
      let text = document.querySelector('.dialogue-bubble')?.innerText;
      // 然后尝试从 scenario-text 获取
      if (!text) text = document.getElementById('scenario-text')?.innerText;
      // 最后从 scenario-desc 获取
      if (!text) text = document.querySelector('.scenario-desc')?.innerText;
      if (!text) return;
      
      if (!settings.soundEnabled) return;
      
      const btn = e?.target;
      if (btn) btn.classList.add('speaking');
      
      // 使用 Web Speech API
      if ('speechSynthesis' in window) {
        // 先取消之前既 speech
        speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = settings.speechRate || 0.9;
        utterance.pitch = 1;
        
        // 搵廣東話 voice - voices 可能需要异步加载
        const getVoice = () => {
          const voices = speechSynthesis.getVoices();
          // 优先搵粵語/香港 voice
          let hkVoice = voices.find(v => v.lang.includes('HK') || v.lang.includes(' canton') || v.lang.includes('yue'));
          if (!hkVoice) hkVoice = voices.find(v => v.lang.startsWith('zh') && (v.lang.includes('HK') || v.lang.includes('yue')));
          if (!hkVoice) hkVoice = voices.find(v => v.lang.startsWith('zh'));
          if (hkVoice) utterance.voice = hkVoice;
        };
        
        // 如果 voices 未加载，等一等
        if (speechSynthesis.getVoices().length > 0) {
          getVoice();
        } else {
          speechSynthesis.addEventListener('voiceschanged', getVoice, { once: true });
        }
        
        utterance.onend = () => btn?.classList.remove('speaking');
        utterance.onerror = (e) => { 
          console.log('TTS error:', e);
          btn?.classList.remove('speaking'); 
        };
        speechSynthesis.speak(utterance);
        
        // 如果 speechSynthesis 处于 pending 状态，等待
        if (speechSynthesis.state === 'pending') {
          speechSynthesis.pause();
          speechSynthesis.resume();
        }
      }
    }

// 選擇選項
    function chooseOption(scenarioId, optionId) {
      const scenario = gameData.scenarios.find(s => s.id === scenarioId);
      if (!scenario) return;

      const option = scenario.options.find(o => o.id === optionId);
      if (!option) return;
      
      // Get option index for skill calculation
      const optionIndex = scenario.options.findIndex(o => o.id === optionId);

      // Play click sound
      AudioSys.click();

      // 保存選擇前既關係值（用于重試）
      previousRelationships = JSON.parse(JSON.stringify(relationships));

      // 應用效果
      const totalChange = option.effects.reduce((sum, e) => sum + e.change, 0);
      option.effects.forEach(effect => {
        relationships[effect.character] = (relationships[effect.character] || 50) + effect.change;
        relationships[effect.character] = Math.max(-100, Math.min(100, relationships[effect.character]));
      });
      
      // 更新技能點數 - passing scenarioId 同 optionIndex
      updateSkillPoints(option.effects, scenarioId, optionIndex);
      
      // 視覺效果：正向=粒子+綠光閃爍 / 負向=震動+紅閃爍
      const gameArea = document.getElementById('game-area');
      if (totalChange > 0) {
        showParticles('positive');
        gameArea.classList.add('positive-flash');
        setTimeout(() => gameArea.classList.remove('positive-flash'), 500);
      } else if (totalChange < 0) {
        triggerShake();
        gameArea.classList.add('negative-flash');
        setTimeout(() => gameArea.classList.remove('negative-flash'), 400);
      }
      
      // Mark as completed
      if (!completedScenarios.includes(scenarioId)) {
        completedScenarios.push(scenarioId);
      }

      saveRelationships();
      showRelationships();

      showResult(option.effects, () => {
        const nextId = option.next_scenario;
        const nextScenario = nextId ? gameData.scenarios.find(s => s.id === nextId) : null;

        if (nextScenario) {
          nextScenario.characters.forEach(char => {
            if (relationships[char.name] === undefined) {
              relationships[char.name] = char.initial_relationship;
            }
          });
          showScenario(nextScenario);
        } else {
          checkEnding();
        }
      });
    }

// 顯示結果 - FeedbackModal 兩階段顯示
    function showResult(effects, onContinue) {
      const gameArea = document.getElementById('game-area');

      //.Play success/fail sound based on effect
      const totalChange = effects.reduce((sum, e) => sum + e.change, 0);
      if (totalChange > 0) AudioSys.success();
      else if (totalChange < 0) AudioSys.fail();

      // 第一階段：後果敘述
      const comments = effects.map(e => {
        const emoji = getCharacterEmoji(e.character);
        const change = e.change;
        const changeText = change > 0 ? `+${change}` : change;
        return `<strong>${emoji} ${e.character}:</strong> ${e.comment} <span class="change-amount">(${changeText}❤️)</span>`;
      }).join('<br><br>');
      
      gameArea.innerHTML = `
        <div class="result-overlay show">
          <div class="result-card feedback-modal">
            <div class="feedback-stage stage-consequence">
              <div class="feedback-title">📢 發生咩事？</div>
              <div class="result-comment">${comments}</div>
              <button class="continue-btn" onclick="showGuidanceTip(this)">睇下點樣做得更好 💡</button>
            </div>
            
            <div class="feedback-stage stage-guidance" style="display:none;">
              <div class="feedback-title">💡 俾啲提示你</div>

              </div>

// 綁定回調函數

    function finishFeedback(btn) {
      btn.closest('.result-overlay').remove();
      currentOnContinue?.();

    // 重試（返回選擇）
    function retryChoice() {
      // 恢復關係值到選擇前
      if (previousRelationships) {
        relationships = JSON.parse(JSON.stringify(previousRelationships));
        saveRelationships();
        showRelationships();
        // 移除彈窗
        document.querySelector('.result-overlay')?.remove();
        // 重新顯示當前情景
        showScenario(currentScenario);
      } else {
        // 如果冇 previousRelationships，直接 close modal 同 reload scenario
        document.querySelector('.result-overlay')?.remove();
        if (currentScenario) showScenario(currentScenario);
      }
    }

      console.log('[DEBUG] checkEnding called');
      console.log('[DEBUG] relationships:', relationships);
      console.log('[DEBUG] gameData.endings:', gameData.endings);
      
      const keys = Object.keys(relationships);
      if (keys.length === 0) {
        showDefaultEnding();
        return;
      }
      
      const avgRelationship = Object.values(relationships).reduce((a, b) => a + b, 0) / keys.length;
      console.log('[DEBUG] avgRelationship:', avgRelationship);

      // 搵岩既ending
      const validEndings = gameData.endings.filter(e => avgRelationship >= e.min_relationship);
      console.log('[DEBUG] validEndings:', validEndings);
      
      if (validEndings.length > 0) {
        // 搵最高min_relationship既
        validEndings.sort((a, b) => b.min_relationship - a.min_relationship);
        showEnding(validEndings[0]);
      } else {
        showDefaultEnding();
      }
    }

      currentScenarioNum = 0;

      startGame();
    }

    // 回首頁

      relationships = {};
      saveRelationships();
      location.reload();
    }

    // Admin
    function toggleAdmin() {
      const panel = document.getElementById('admin-panel');
      const editor = document.getElementById('json-editor');
      
      if (panel.classList.contains('show')) {
        panel.classList.remove('show');
      } else {
        editor.value = JSON.stringify(gameData, null, 2);
        panel.classList.add('show');
      }
    }

    function saveScenarios() {
      try {
        const editor = document.getElementById('json-editor');
        gameData = JSON.parse(editor.value);
        localStorage.setItem('friendly-classroom-v2-scenarios', JSON.stringify(gameData));
        alert('✅ 已儲存！');
        toggleAdmin();
        restartGame();
      } catch (e) {
        alert('❌ JSON 錯誤: ' + e.message);
      }
    }

    // 啟動
